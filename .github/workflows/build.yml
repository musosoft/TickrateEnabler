name: Build

on:
  push:
  pull_request:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: build on ${{ matrix.os_short }} tick ${{ matrix.tickrate }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        tickrate:
          - ''
          - 100
          - 200
        os:
          - ubuntu-22.04
          - windows-2022

        include:
          - os: ubuntu-22.04
            os_short: linux

          - os: windows-2022
            os_short: win

    steps:
      - name: Prepare env
        shell: bash
        run: |
          $(test -z ${{ matrix.tickrate }}) || echo "tickrate=-tick${{ matrix.tickrate }}" >> $GITHUB_ENV
          echo "GITHUB_SHA_SHORT=${GITHUB_SHA::7}" >> $GITHUB_ENV
          
      - name: Install (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y clang g++-multilib
          echo "CC=clang" >> $GITHUB_ENV
          echo "CXX=clang++" >> $GITHUB_ENV
          
      - name: Setting up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10' 

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install git+https://github.com/alliedmodders/ambuild

      - name: Checking out MM:Source
        uses: actions/checkout@v6
        with:
          repository: alliedmodders/metamod-source
          ref: 1.12-dev
          path: metamod-source

      - name: Checking out hl2sdk-css
        uses: actions/checkout@v6
        with:
          repository: alliedmodders/hl2sdk
          ref: css
          path: hl2sdk-css

      - name: Checking out own repository
        uses: actions/checkout@v6
        with:
          path: TickrateEnabler

      - name: Compiling
        working-directory: TickrateEnabler
        run: |
          python3 configure.py --enable-optimize --symbol-files --sdks=css --targets=x86,x86_64 --tickrate=${{ matrix.tickrate }}
          ambuild objdir
          
      - name: Uploading package
        uses: actions/upload-artifact@v4
        with:
          name: TickrateEnabler-${{ matrix.os_short }}${{ env.tickrate }}-${{ env.GITHUB_SHA_SHORT }}
          path: TickrateEnabler/objdir/package
          
  release:
    name: Release
    permissions:
      contents: write
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4

      - name: Archive Assets
        shell: bash
        run: find * -maxdepth 0 -type d -exec zip -r {}.zip {} \;

      - name: Create Release
        shell: bash
        run: gh release create ${{ github.ref_name }} --title ${{ github.ref_name }} --latest -R ${{ github.repository }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload assets
        shell: bash
        run: gh release upload ${{ github.ref_name }} *.zip -R ${{ github.repository }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
